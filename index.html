<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#121214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Reaksiyon</title>
<style>
  :root{--bg:#121214;--card:#1a1a1e;--primary:#00e676;--danger:#ff1744;--text:#fff;--sec:#a0a0a5;--tab:#2979ff}
  *{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom) 12px 12px;display:flex;flex-direction:column;align-items:center;-webkit-user-select:none;user-select:none;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  .container{width:100%;max-width:500px}
  h1{text-align:center;font-size:20px;margin:8px 0 4px;color:var(--primary)}
  .status-bar{text-align:center;font-size:13px;color:var(--sec);margin-bottom:12px}
  .card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px}
  .label{font-size:11px;color:var(--sec);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:6px}
  button{width:100%;min-height:48px;padding:16px;border:none;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer;transition:all .15s;margin-bottom:8px;touch-action:manipulation}
  button:active{opacity:.85}
  .btn-connect{background:#2979ff;color:#fff;font-size:17px}
  .btn-connect.connected{background:var(--danger)}
  .btn-start{background:var(--primary);color:#121214;font-size:18px;padding:18px}
  .btn-start:disabled{background:#334038;color:#555;cursor:not-allowed}
  .btn-clear{background:#c23616;color:#fff;font-size:13px;padding:12px}
  .btn-undo{background:#555;color:#fff;font-size:13px;padding:12px}
  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  input[type="text"]{width:100%;padding:12px;background:#26262b;border:1px solid #3a3a42;border-radius:6px;color:#fff;font-size:16px;text-align:center;letter-spacing:2px}
  .cihaz-durum{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .cihaz-item{text-align:center;padding:8px 4px;border-radius:8px;background:#26262b;min-width:56px;flex:1}
  .cihaz-item .isim{font-size:11px;color:var(--sec);margin-bottom:4px}
  .cihaz-item .nokta{width:14px;height:14px;border-radius:50%;display:inline-block}
  .nokta.on{background:var(--primary);box-shadow:0 0 8px var(--primary)}
  .nokta.off{background:#555}
  .btn-cihazlar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
  .btn-cihaz{padding:16px 0;font-size:20px;margin-bottom:0;min-height:56px;flex:1;min-width:60px;max-width:90px}
  .btn-cihaz:active{transform:scale(0.93);opacity:0.7}
  .sira-goster{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
  .sira-chip{padding:4px 8px;border-radius:4px;font-size:12px;font-weight:bold}
  #sonuc{background:#0b0b0c;border:1px solid #222;border-radius:8px;padding:12px;max-height:40vh;max-height:40dvh;min-height:120px;overflow-y:auto;font-family:"Courier New",monospace;font-size:12px;white-space:pre-wrap;line-height:1.4;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  #sonuc div{margin-bottom:2px}
  .ok{color:var(--primary)}.err{color:var(--danger)}.rpt{color:#ffab00;font-weight:bold}.sys{color:#2979ff}
  .tab-bar{display:flex;gap:4px;margin-bottom:12px;position:sticky;top:0;z-index:10;background:var(--bg);padding:6px 0}
  .tab-btn{flex:1;padding:14px 4px;min-height:48px;border:none;border-radius:10px;font-weight:bold;font-size:15px;cursor:pointer;transition:all .15s;background:#2a2a2e;color:#666;margin-bottom:0;white-space:nowrap}
  .tab-btn.active{background:var(--tab);color:#fff}
  .tab-content{display:none}
  .tab-content.active{display:block}
  input[type="range"]{width:100%;margin-bottom:10px;accent-color:var(--primary);height:36px}
  .bos-sekme{text-align:center;color:var(--sec);font-size:14px;padding:24px 0}
  @media (max-width:360px){
    body{padding-left:8px;padding-right:8px}
    h1{font-size:18px}
    .card{padding:12px}
    .btn-cihaz{min-width:52px;max-width:76px;padding:14px 0;font-size:18px}
  }
</style>
</head>
<body>
<div class="container">
  <h1>REAKSIYON <span style="font-size:11px;color:#ffab00">v4</span></h1>
  <div class="status-bar" id="status">Durum: Baglanti Yok</div>

  <button id="connectBtn" class="btn-connect" onclick="baglanTikla()">Sisteme Baglan</button>

  <div id="kontrolKart" class="card" style="display:none">
    <span class="label">Cihaz Durumlari</span>
    <div class="cihaz-durum" id="cihazDurumAlani"></div>

    <div class="tab-bar">
      <button class="tab-btn active" onclick="sekmeAc('reaksiyon')">Reaksiyon</button>
      <button class="tab-btn" onclick="sekmeAc('seri')">Seri Olustur</button>
      <button class="tab-btn" onclick="sekmeAc('oyun')">Oyun</button>
    </div>

    <div id="tab-reaksiyon" class="tab-content active">
      <span class="label">Sure: <span id="sureDegerReaksiyon">5</span> sn</span>
      <input type="range" id="sureInputReaksiyon" value="5" min="3" max="10">
      <span class="label">Cihaz Sec, Tikla ve Dene</span>
      <div class="btn-cihazlar" id="reaksiyonCihazAlani"></div>
    </div>

    <div id="tab-seri" class="tab-content">
      <span class="label">Sure: <span id="sureDegerSeri">5</span> sn</span>
      <input type="range" id="sureInputSeri" value="5" min="3" max="10">
      <span class="label">Cihaz Sirasi</span>
      <div class="btn-cihazlar" id="seriCihazAlani"></div>
      <input type="text" id="siraInput" readonly>
      <div id="siraGoster" class="sira-goster"></div>
      <div class="btn-row">
        <button class="btn-clear" onclick="siraTemizle()">Hepsini Temizle</button>
        <button class="btn-undo" onclick="sonSil()">Sil</button>
      </div>
      <button id="startBtn" class="btn btn-start" onclick="startGame()" disabled>OYUNU BASLAT</button>
    </div>

    <div id="tab-oyun" class="tab-content">
      <div class="bos-sekme">Yakinda</div>
    </div>
  </div>

  <div class="card">
    <span class="label">Sonuc</span>
    <div id="sonuc">Henuz sonuc yok.</div>
  </div>
</div>

<script>
var SERVICE_UUID="4fafc201-1fb5-459e-8fcc-c5c9c331914b";
var RX_UUID="6d6534e7-d172-4a66-b223-5b955f7d315b";
var TX_UUID="a87e5b8d-69b0-4dbf-b513-fc482a514d45";

var bleDevice=null, rxChar=null;
var siradizisi=[];
var oyunDevam=false;
var cihazDurum={};
var cihazRenkleri={
  1:{bg:'#e94560'},
  2:{bg:'#2979ff'},
  3:{bg:'#7c4dff'},
  4:{bg:'#ff9100'},
  5:{bg:'#00bcd4'},
  6:{bg:'#8bc34a'},
  7:{bg:'#ff5722'},
  8:{bg:'#e040fb'},
  9:{bg:'#76ff03'}
};

var ua=navigator.userAgent;
var isIOS=/iPhone|iPad|iPod/i.test(ua);
var isAndroid=/Android/i.test(ua);
var isChrome=/Chrome/i.test(ua)&&!/Edg|OPR|Firefox/i.test(ua);

function platformKontrol(){
  if(isIOS) return "ios";
  if(isAndroid&&!isChrome) return "android-chrome";
  return "ok";
}

function sayfaKontrol(){
  var durum=platformKontrol();
  if(durum=="ios"){
    uyariGoster('<b>iPhone/iOS tespit edildi!</b><br><br>Web Bluetooth sadece <b>Bluefy</b> tarayicisi ile calisir.<br><br>App Store\'dan Bluefy yukleyerek sayfayi acmaniz gerekiyor.','App Store\'a Git',function(){
      window.open('https://apps.apple.com/app/bluefy-web-ble-browser/id1492822055','_blank');
    });
  } else if(durum=="android-chrome"){
    uyariGoster('<b>Android tespit edildi!</b><br><br>Web Bluetooth icin <b>Chrome</b> tarayicisi gerekli.<br><br>1. Chrome\'u acin<br>2. Adres cubuguna <code style="background:#26262b;padding:4px 8px;border-radius:4px;font-size:13px">chrome://flags/#enable-web-bluetooth</code> yazin<br>3. <b>Web Bluetooth</b> -> <b>Enabled</b><br>4. Chrome\'u yeniden baslatin<br>5. Bu sayfayi tekrar acin','Tamam',function(){
      navigator.clipboard.writeText('chrome://flags/#enable-web-bluetooth').catch(function(){});
    });
  }
}

function uyariGoster(msg,btnText,btnAction){
  var overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
  var box=document.createElement('div');
  box.style.cssText='background:#1a1a1e;border-radius:14px;padding:24px;max-width:360px;width:100%;text-align:center;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
  var p=document.createElement('p');
  p.style.cssText='font-size:15px;line-height:1.5;margin:0 0 20px;color:#e0e0e0';
  p.innerHTML=msg;
  var btn=document.createElement('button');
  btn.textContent=btnText;
  btn.style.cssText='width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer;background:#2979ff;color:#fff';
  btn.onclick=function(){btnAction();overlay.remove()};
  var cancelBtn=document.createElement('button');
  cancelBtn.textContent='Kapat';
  cancelBtn.style.cssText='width:100%;padding:14px;border:none;border-radius:10px;font-size:14px;cursor:pointer;background:transparent;color:#a0a0a5;margin-top:8px';
  cancelBtn.onclick=function(){overlay.remove()};
  box.appendChild(p);box.appendChild(btn);box.appendChild(cancelBtn);overlay.appendChild(box);
  document.body.appendChild(overlay);
}

function baglanTikla(){
  if(bleDevice&&bleDevice.gatt.connected){bleDevice.gatt.disconnect();return;}
  var durum=platformKontrol();
  if(durum=="ios"){
    uyariGoster('<b>iPhone/iOS tespit edildi!</b><br><br>Web Bluetooth sadece <b>Bluefy</b> tarayicisi ile calisir.','App Store\'a Git',function(){
      window.open('https://apps.apple.com/app/bluefy-web-ble-browser/id1492822055','_blank');
    });return;
  }
  if(durum=="android-chrome"){
    uyariGoster('<b>Android tespit edildi!</b><br><br>Web Bluetooth icin <b>Chrome</b> tarayicisi gerekli.','Tamam',function(){
      navigator.clipboard.writeText('chrome://flags/#enable-web-bluetooth').catch(function(){});
    });return;
  }
  if(isChrome&&!navigator.bluetooth){
    uyariGoster('<b>Web Bluetooth Kapali!</b><br><br>Chrome\'da Web Bluetooth\'u aktif etmeniz gerekiyor.','Tamam',function(){
      navigator.clipboard.writeText('chrome://flags/#enable-web-bluetooth').catch(function(){});
    });return;
  }
  toggleConnection();
}

var sonuc=document.getElementById('sonuc');
function sonucEkle(metin,tip){
  var s=document.createElement('div');
  if(tip)s.className=tip;
  s.textContent=metin;
  sonuc.appendChild(s);
  sonuc.scrollTop=sonuc.scrollHeight;
}
function sonucTemizle(){sonuc.innerHTML='';}

// --- Tab ---
function sekmeAc(tab){
  var harita={'reaksiyon':0,'seri':1,'oyun':2};
  document.querySelectorAll('.tab-btn').forEach(function(b,i){
    b.classList.toggle('active',i===harita[tab]);
  });
  document.querySelectorAll('.tab-content').forEach(function(c){c.classList.remove('active')});
  document.getElementById('tab-'+tab).classList.add('active');
}

// --- Cihaz Guncelleme ---
function cihazDurumAlaniniGuncelle(){
  var alan=document.getElementById('cihazDurumAlani');
  alan.innerHTML='';
  for(var n=1;n<=9;n++){
    var aktif=(n===1)||cihazDurum[n]===true;
    var item=document.createElement('div');
    item.className='cihaz-item';
    item.id='cihazItem'+n;
    item.innerHTML='<div class="isim">Cihaz-'+n+'</div><span class="nokta '+(aktif?'on':'off')+'"></span>';
    if(!aktif)item.style.opacity='0.3';
    alan.appendChild(item);
  }
}

function renderCihazButonlari(alanId,mod){
  var alan=document.getElementById(alanId);
  alan.innerHTML='';
  for(var n=1;n<=9;n++){
    if(n>1&&cihazDurum[n]!==true)continue;
    var btn=document.createElement('button');
    btn.id=alanId+'_'+n;
    btn.className='btn-cihaz';
    btn.style.background=cihazRenkleri[n].bg;
    btn.style.color=(n===9)?'#121214':'#fff';
    btn.textContent=n;
    btn.onclick=(function(num){return function(){
      if(mod==='test'){testCihaz(num);}else{siraEkle(num);}
    }})(n);
    alan.appendChild(btn);
  }
}

function cihazButonlariGuncelle(){
  renderCihazButonlari('reaksiyonCihazAlani','test');
  renderCihazButonlari('seriCihazAlani','sira');
}

function cihazGuncelle(durumlar){
  for(var i=0;i<8;i++){
    var n=i+2;
    if(durumlar[i]){cihazDurum[n]=true;}else{delete cihazDurum[n];}
  }
  cihazDurumAlaniniGuncelle();
  cihazButonlariGuncelle();
}

// --- BLE ---
async function toggleConnection(){
  if(bleDevice&&bleDevice.gatt.connected){bleDevice.gatt.disconnect();return;}
  try{
    document.getElementById('status').innerText="Durum: Araniyor...";
    bleDevice=await navigator.bluetooth.requestDevice({
      filters:[{namePrefix:'Reaksiyon', services:[SERVICE_UUID]}],
      optionalServices:[SERVICE_UUID]
    });
    var server=await bleDevice.gatt.connect();
    var service=await server.getPrimaryService(SERVICE_UUID);
    rxChar=await service.getCharacteristic(RX_UUID);
    var txChar=await service.getCharacteristic(TX_UUID);
    await txChar.startNotifications();
    var bleTampon=new Uint8Array(0);
    function isleMesaj(metin){
      if(metin.indexOf("DURUM:")==0){
        document.getElementById('status').innerText="Durum: BAGLANDI";
        try{
          var json=JSON.parse(metin.substring(6));
          if(json.cihazlar){
            cihazGuncelle(json.cihazlar);
          }
        }catch(ex){}
        return;
      }
      if(metin.indexOf("Baglandi:")>=0||metin.indexOf("baglandi:")>=0){
        var m=metin.match(/Cihaz-(\d+)/);
        if(m){cihazDurum[parseInt(m[1])]=true;cihazDurumAlaniniGuncelle();cihazButonlariGuncelle();}
        sonucEkle(metin.trim(),"sys");
        return;
      }
      if(metin.indexOf("Koptu:")>=0){
        var m=metin.match(/Cihaz-(\d+)/);
        if(m){delete cihazDurum[parseInt(m[1])];cihazDurumAlaniniGuncelle();cihazButonlariGuncelle();}
        sonucEkle(metin.trim(),"err");
        return;
      }
      if(metin.indexOf("OYUN BASLADI")>=0){
        oyunDevam=true;
        sonucTemizle();
        sonucEkle("OYUN BASLADI","ok");
        document.getElementById('startBtn').innerText='OYUNU BITIR';
        document.getElementById('startBtn').style.background='#ff1744';
        return;
      }
      if(metin.indexOf("OYUN SIFIRLANDI")>=0){
        oyunDevam=false;
        document.getElementById('startBtn').innerText='OYUNU BASLAT';
        document.getElementById('startBtn').style.background='#00e676';
        sonucEkle("OYUN SIFIRLANDI","err");
        return;
      }
      if(metin.indexOf("TEST:")>=0){
        var isErr=metin.indexOf("Sure bitti")>=0||metin.indexOf("yanit vermedi")>=0||metin.indexOf("bagli degil")>=0;
        sonucEkle(metin.trim(),isErr?"err":"ok");
        return;
      }
      if(metin.indexOf("Toplam Sure:")>=0){
        oyunDevam=false;
        document.getElementById('startBtn').innerText='OYUNU BASLAT';
        document.getElementById('startBtn').style.background='#00e676';
        sonucEkle(metin.trim(),"rpt");
        return;
      }
      sonucEkle(metin.trim(),"rpt");
    }
    txChar.addEventListener('characteristicvaluechanged',function(e){
      var dv=e.target.value;
      var u8=new Uint8Array(dv.buffer,dv.byteOffset,dv.byteLength);
      var yeni=new Uint8Array(bleTampon.length+u8.length);
      yeni.set(bleTampon);yeni.set(u8,bleTampon.length);
      bleTampon=yeni;
      var idx;
      while((idx=bleTampon.indexOf(10))>=0){
        var tam=bleTampon.slice(0,idx);
        bleTampon=bleTampon.slice(idx+1);
        isleMesaj(new TextDecoder('utf-8').decode(tam).trim());
      }
    });
    document.getElementById('status').innerText="Durum: BAGLANDI";
    document.getElementById('connectBtn').innerText="BAGLANTIYI KES";
    document.getElementById('connectBtn').className="btn-connect connected";
    document.getElementById('startBtn').disabled=false;
    document.getElementById('kontrolKart').style.display='block';
    sonucTemizle();
    cihazDurum={};
    cihazDurumAlaniniGuncelle();
    cihazButonlariGuncelle();
    bleDevice.addEventListener('gattserverdisconnected',function(){
      document.getElementById('status').innerText="Durum: Koptu";
      document.getElementById('connectBtn').innerText="Sisteme Baglan";
      document.getElementById('connectBtn').className="btn-connect";
      document.getElementById('startBtn').disabled=true;
      document.getElementById('startBtn').innerText='OYUNU BASLAT';
      document.getElementById('startBtn').style.background='#00e676';
      document.getElementById('kontrolKart').style.display='none';
      cihazDurum={};
      oyunDevam=false;
    });
  }catch(e){
    sonucEkle("Hata: "+e.message,"err");
    document.getElementById('status').innerText="Durum: Hata";
  }
}

function gonder(mesaj){
  return rxChar.writeValue(new TextEncoder().encode(mesaj));
}

function gecikme(ms){
  return new Promise(function(r){setTimeout(r,ms)});
}

// --- Reaksiyon Sekmesi ---
async function testCihaz(n){
  if(!rxChar||oyunDevam)return;
  var sure=document.getElementById('sureInputReaksiyon').value;
  sonucTemizle();
  try{
    await gonder("SURE:"+sure+"\n");
    await gecikme(100);
    await gonder("TEST:"+n+"\n");
    sonucEkle("Test: Cihaz-"+n+" ("+sure+" sn)","sys");
  }catch(e){sonucEkle("Gonderim hatasi: "+e.message,"err");}
}

// --- Seri Sekmesi ---
async function startGame(){
  if(!rxChar)return;
  if(oyunDevam){
    try{await gonder("STOP\n");}catch(e){sonucEkle("Gonderim hatasi: "+e.message,"err");}
    return;
  }
  var sira=siradizisi.join(',');
  if(!sira){alert("Once sira olusturun!");return}
  var sure=document.getElementById('sureInputSeri').value;
  sonucTemizle();
  try{
    await gonder("SURE:"+sure+"\n");
    await gecikme(200);
    await gonder(sira+"\n");
  }catch(e){sonucEkle("Gonderim hatasi: "+e.message,"err");}
}

document.getElementById('sureInputReaksiyon').oninput=function(){document.getElementById('sureDegerReaksiyon').innerText=this.value};
document.getElementById('sureInputSeri').oninput=function(){document.getElementById('sureDegerSeri').innerText=this.value};

function siraEkle(n){
  siradizisi.push(n);
  document.getElementById('siraInput').value=siradizisi.join(',');
  document.getElementById('siraGoster').innerHTML=siradizisi.map(function(m,i){
    return '<span class="sira-chip" style="background:'+cihazRenkleri[m].bg+';color:#fff">'+(i+1)+':'+m+'</span>';
  }).join('');
}

function siraTemizle(){
  siradizisi=[];
  document.getElementById('siraInput').value='';
  document.getElementById('siraGoster').innerHTML='';
}

function sonSil(){
  if(siradizisi.length===0)return;
  siradizisi.pop();
  document.getElementById('siraInput').value=siradizisi.join(',');
  document.getElementById('siraGoster').innerHTML=siradizisi.map(function(m,i){
    return '<span class="sira-chip" style="background:'+cihazRenkleri[m].bg+';color:#fff">'+(i+1)+':'+m+'</span>';
  }).join('');
}

sayfaKontrol();
</script>
</body>
</html>
